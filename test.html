<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Asteroides Matemáticos</title>
</head>
<body>
    <h1>Test de Carga de Scripts</h1>
    <div id="resultados"></div>

    <script>
        const resultados = document.getElementById('resultados');
        
        function log(mensaje, tipo = 'info') {
            const p = document.createElement('p');
            p.textContent = mensaje;
            p.style.color = tipo === 'error' ? 'red' : tipo === 'success' ? 'green' : 'black';
            resultados.appendChild(p);
        }

        // Test 1: CONFIG
        try {
            if (typeof CONFIG !== 'undefined') {
                log('✓ CONFIG cargado correctamente', 'success');
            } else {
                log('✗ CONFIG no está definido', 'error');
            }
        } catch(e) {
            log('✗ Error con CONFIG: ' + e.message, 'error');
        }
    </script>

    <script src="js/configuracion.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/gestorAudio.js"></script>
    <script src="js/operacionMatematica.js"></script>
    <script src="js/particula.js"></script>
    <script src="js/asteroide.js"></script>
    <script src="js/nave.js"></script>
    <script src="js/itemEspecial.js"></script>
    <script src="js/gestorNivel.js"></script>
    <script src="js/gestorJuego.js"></script>
    <script src="js/juego.js"></script>

    <script>
        // Tests después de cargar scripts
        setTimeout(() => {
            log('\n=== Verificando clases y objetos ===');
            
            // Test CONFIG
            try {
                log('CONFIG.CANVAS.ANCHO: ' + CONFIG.CANVAS.ANCHO, 'success');
            } catch(e) {
                log('Error CONFIG: ' + e.message, 'error');
            }

            // Test Utilidades
            try {
                const num = Utilidades.numeroAleatorio(1, 10);
                log('✓ Utilidades.numeroAleatorio funcionando: ' + num, 'success');
            } catch(e) {
                log('✗ Error Utilidades: ' + e.message, 'error');
            }

            // Test Clases
            const clases = [
                'GestorAudio',
                'OperacionMatematica',
                'Particula',
                'SistemaParticulas',
                'Asteroide',
                'Laser',
                'Nave',
                'ItemEspecial',
                'GestorNivel',
                'GestorJuego'
            ];

            clases.forEach(clase => {
                try {
                    if (typeof window[clase] !== 'undefined') {
                        log('✓ Clase ' + clase + ' disponible', 'success');
                    } else {
                        log('✗ Clase ' + clase + ' no encontrada', 'error');
                    }
                } catch(e) {
                    log('✗ Error con ' + clase + ': ' + e.message, 'error');
                }
            });

            // Test gestorJuego
            try {
                if (typeof gestorJuego !== 'undefined' && gestorJuego !== null) {
                    log('✓ gestorJuego inicializado', 'success');
                } else {
                    log('✗ gestorJuego no inicializado', 'error');
                }
            } catch(e) {
                log('✗ Error gestorJuego: ' + e.message, 'error');
            }
        }, 1000);
    </script>
</body>
</html>
