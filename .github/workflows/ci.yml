# Integración continua: en cada PR y en cada push a una rama, corre las pruebas y el build.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main ya lo cubre el despliegue (pages.yml)

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm sale de "packageManager" en package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: falla si pnpm-lock.yaml no coincide con package.json (ver docs/SEGURIDAD-DEPENDENCIAS.md)
      - run: pnpm install --frozen-lockfile

      - name: Pruebas unitarias y build
        run: pnpm check

      # ubuntu-latest trae Google Chrome en /usr/bin/google-chrome (lo busca tests-e2e/ayudas.mjs)
      - name: Pruebas en navegador (Chrome real)
        run: pnpm test:e2e
